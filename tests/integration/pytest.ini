# Integration test suite: boots a real Home Assistant container via the
# ha_integration_test_harness pytest plugin. Needs Docker and the dependencies
# in tests/integration/requirements.txt (kept apart from requirements_test.txt:
# pytest-homeassistant-custom-component blocks network sockets in every test).
#
# Having its own config file makes tests/integration the rootdir when it is run
# on its own, so the unit-test conftest.py in tests/ is not loaded. The
# top-level pytest.ini ignores this directory, so a plain `pytest` only runs the
# unit tests.
#
# HOME_ASSISTANT_CONFIG_ROOT must point at tests/integration/ha_config, with the
# integration under test copied into its custom_components/ (the workflow does
# both). To run locally from the repository root:
#   pip install -r tests/integration/requirements.txt
#   mkdir -p tests/integration/ha_config/custom_components
#   cp -r custom_components/climate_template tests/integration/ha_config/custom_components/
#   export HOME_ASSISTANT_CONFIG_ROOT="$(pwd)/tests/integration/ha_config"
#   pytest tests/integration
[pytest]
addopts = -v
